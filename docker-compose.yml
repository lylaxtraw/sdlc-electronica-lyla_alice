services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sensorhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Aquí inyectamos la variable. Nota que el host es 'db' (el nombre del servicio de arriba), no 'localhost'
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/sensorhub_db
    depends_on:
      - db

volumes:
  postgres_data: